<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>PRMAX — відкриваємо Viber</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0B0A09;color:#F5F3EF;font:16px/1.5 system-ui,-apple-system,sans-serif;text-align:center;padding:24px}
a{display:inline-block;margin:8px;padding:14px 22px;border-radius:999px;text-decoration:none;font-weight:700}
.v{background:#7360F2;color:#fff}.c{background:#2a2622;color:#F5F3EF}
p{color:rgba(245,243,239,.7);max-width:360px;margin:12px auto}
</style>
</head>
<body>
<div>
  <h2 id="h">Відкриваємо Viber…</h2>
  <p id="t"></p>
  <a class="v" id="vb" href="#">Написати у Viber</a>
  <a class="c" id="cl" href="#">Подзвонити</a>
</div>
<script>
// Перехідник для кнопок у Telegram (Telegram не дозволяє viber:// і tel: у кнопках).
// ?n=380XXXXXXXXX — номер; ?a=call — одразу дзвінок; ?d=текст — чернетка повідомлення у Viber.
(function(){
  var q=new URLSearchParams(location.search), n=(q.get('n')||'').replace(/\D/g,''), d=q.get('d')||'', a=q.get('a');
  if(n.length===10&&n[0]==='0')n='38'+n;
  if(!/^\d{11,13}$/.test(n)){document.getElementById('h').textContent='Номер не вказано';return;}
  var vib='viber://chat?number=%2B'+n+(d?'&draft='+encodeURIComponent(d):''), tel='tel:+'+n;
  document.getElementById('vb').href=vib; document.getElementById('cl').href=tel;
  document.getElementById('t').textContent='+'+n+(d?' · текст уже вставлено, лишилось натиснути «Надіслати»':'');
  if(a==='call'){document.getElementById('h').textContent='Дзвонимо…';location.href=tel;} else location.href=vib;
})();
</script>
</body>
</html>
